[project]
name = "hotel-booking-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Vladislav Ibraev",email = "vladislavibraev@gmail.com"}
]
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "django (==4.2.1)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "psycopg[binary] (>=3.2)",
    "django-environ (>=0.12.0,<0.13.0)"
]
[tool.poetry]
package-mode = false


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.2"
pre-commit = "^4.3.0"
pytest = "^8.4.2"
pytest-django = "^4.11.1"
pytest-cov = "^7.0.0"
model-bakery = "^1.20.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 79
respect-gitignore = true
extend-exclude = ["migrations", ".venv", "venv", ".ruff_cache"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
extend-select = [
  "E4", "E7", "E9", "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "N",
  "DJ",
  "PT",
  "ISC", "Q", "PTH", "T20",
  "RUF"
]
ignore = ["RUF001", "RUF002"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.extend-per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["hotel_booking_service"]
